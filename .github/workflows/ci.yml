name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes | grep iOS || true

      - name: Build
        run: |
          # iPhone 17 ships with Xcode 26 on macos-15 runners. Hardcoded
          # because Xcode 26 only includes simulators for iPhone 16 and 17
          # series — there's no risk of "model not found" on a supported
          # runner, and if a future runner drops it the build fails clearly
          # instead of silently falling back to an older device.
          xcodebuild build \
            -project Listener.xcodeproj \
            -scheme Listener \
            -destination 'platform=iOS Simulator,name=iPhone 17'

      - name: Test
        run: |
          # Note: do NOT set CODE_SIGNING_ALLOWED=NO. KeychainManagerTests
          # exercise the real Security framework and the simulator keychain
          # returns errSecMissingEntitlement (-34018) unless the test bundle
          # is code-signed. xcodebuild ad-hoc signs simulator builds by
          # default, which is sufficient for keychain access to work.
          xcodebuild test \
            -project Listener.xcodeproj \
            -scheme Listener \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:ListenerTests
